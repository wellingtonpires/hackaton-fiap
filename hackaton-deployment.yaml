apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: hackaton
  name: hackaton
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: hackaton
  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/hackaton-network: "true"
        io.kompose.service: hackaton
    spec:
      containers:
        - image: wellingt0npires/hackaton:latest
          name: hackaton
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 900m
              memory: 900Mi
      restartPolicy: Always
      