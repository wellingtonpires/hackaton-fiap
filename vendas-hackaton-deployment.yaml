apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ./kompose convert
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: vendas-hackaton
  name: vendas-hackaton
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: vendas-hackaton
  template:
    metadata:
      annotations:
        kompose.cmd: ./kompose convert
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/hackaton-network: "true"
        io.kompose.service: vendas-hackaton
    spec:
      containers:
        - image: wellingt0npires/vendas-hackaton:latest
          name: vendas-hackaton
          ports:
            - containerPort: 8086
              hostPort: 8086
              protocol: TCP
          resources:
            requests:
              cpu: 900m
              memory: 900Mi
      restartPolicy: Always